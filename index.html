<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Liminaristas</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--white:#fff;--border:#e2e6ed;--accent:#1a56db;--accent-light:#ebf0ff;--green:#0e9f6e;--green-light:#def7ec;--amber:#c27803;--amber-light:#fdf6b2;--red:#e02424;--red-light:#fde8e8;--purple:#7e3af2;--purple-light:#edebff;--blue2:#0ea5e9;--blue2-light:#e0f2fe;--text:#111928;--sub:#6b7280;--muted:#9ca3af;--card-border:#dde1ea;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:#111928;padding:0 36px;height:64px;display:flex;align-items:center;justify-content:space-between;}
.header-left{display:flex;align-items:center;gap:14px;}
.logo{width:36px;height:36px;background:linear-gradient(135deg,#1a56db,#7e3af2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;}
header h1{font-family:'Syne',sans-serif;font-size:17px;color:#fff;letter-spacing:.01em;}
header p{font-size:12px;color:#6b7280;}
.header-date{font-size:12px;color:#6b7280;}
.tab-bar{background:var(--white);border-bottom:1px solid var(--border);padding:0 36px;display:flex;}
.tab-btn{padding:14px 20px;font-size:13px;font-weight:500;color:var(--sub);cursor:pointer;border:none;background:transparent;border-bottom:2px solid transparent;transition:all .15s;font-family:inherit;white-space:nowrap;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
main{padding:28px 36px;}
.kpi-strip{display:flex;gap:12px;margin-bottom:28px;flex-wrap:wrap;}
.kpi-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 22px;display:flex;align-items:center;gap:14px;flex:1;min-width:140px;}
.kpi-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.kpi-icon.green{background:var(--green-light);}
.kpi-icon.amber{background:var(--amber-light);}
.kpi-icon.purple{background:var(--purple-light);}
.kpi-num{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;line-height:1;}
.kpi-num.green{color:var(--green);}
.kpi-num.amber{color:var(--amber);}
.kpi-num.purple{color:var(--purple);}
.kpi-label{font-size:12px;color:var(--sub);margin-top:2px;font-weight:500;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.section-head h2{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.active-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-light);display:inline-block;}
.search-wrap{display:flex;align-items:center;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:0 12px;gap:8px;}
.search-wrap input{border:none;outline:none;background:transparent;font-size:13px;padding:8px 0;color:var(--text);font-family:inherit;width:220px;}
.search-wrap input::placeholder{color:var(--muted);}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;}

/* CARD */
.cand-card{background:var(--white);border:1px solid var(--card-border);border-radius:14px;overflow:hidden;transition:box-shadow .15s,transform .15s;}
.cand-card:hover{box-shadow:0 6px 24px rgba(0,0,0,.09);transform:translateY(-2px);}
.card-top{padding:16px 18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;}
.card-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#dbeafe,#ede9fe);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--accent);flex-shrink:0;text-transform:uppercase;}
.card-title{flex:1;}
.card-name{font-weight:600;font-size:13.5px;line-height:1.3;color:var(--text);}
.card-insc{font-size:11px;color:var(--muted);margin-top:2px;font-family:'Courier New',monospace;}
.card-status{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.card-status.ativo{background:var(--green-light);color:var(--green);}
.card-status.ativo::before{content:'●';font-size:8px;}

/* CARD BODY */
.card-body{padding:14px 18px;display:flex;flex-direction:column;gap:9px;}
.card-row{display:flex;align-items:flex-start;gap:8px;}
.card-row-icon{width:22px;height:22px;border-radius:5px;background:#f9fafb;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:1px;}
.card-row-label{font-size:11px;color:var(--muted);min-width:96px;font-weight:500;padding-top:2px;}
.card-row-val{font-size:12.5px;color:var(--text);flex:1;line-height:1.45;}
.card-row-val.hl{color:var(--accent);font-weight:600;}
.card-row-val a{color:var(--accent);text-decoration:none;}
.card-row-val a:hover{text-decoration:underline;}

/* ETAPAS SECTION */
.etapas-section{padding:12px 18px;border-top:1px solid var(--border);background:#fafbfc;}
.etapas-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.etapas-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.etapa-chip{border-radius:8px;padding:6px 8px;text-align:center;border:1px solid transparent;}
.etapa-chip-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:3px;}
.etapa-chip-val{font-size:10.5px;font-weight:500;display:block;}
.etapa-aguard{background:#fffbeb;border-color:#fde68a;}.etapa-aguard .etapa-chip-label{color:#92400e;}.etapa-aguard .etapa-chip-val{color:#b45309;}
.etapa-nconv{background:#f3f4f6;border-color:#e5e7eb;}.etapa-nconv .etapa-chip-label{color:#9ca3af;}.etapa-nconv .etapa-chip-val{color:#6b7280;}
.etapa-vazio{background:#f9fafb;border-color:#f3f4f6;}.etapa-vazio .etapa-chip-label{color:#d1d5db;}.etapa-vazio .etapa-chip-val{color:#d1d5db;}

/* PILLS */
.pill{display:inline-flex;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.pill-blue{background:var(--accent-light);color:var(--accent);}
.pill-green{background:var(--green-light);color:var(--green);}
.pill-red{background:var(--red-light);color:var(--red);}
.pill-grey{background:#f3f4f6;color:var(--sub);}
.pill-amber{background:var(--amber-light);color:var(--amber);}

/* FOOTER */
.card-footer{padding:10px 18px;background:#f9fafb;border-top:1px solid var(--border);display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;}
.footer-label{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-top:1px;white-space:nowrap;}
.footer-val{font-size:11.5px;color:var(--sub);font-family:'Courier New',monospace;word-break:break-all;}

.empty{text-align:center;padding:60px 24px;color:var(--muted);grid-column:1/-1;}
.empty-icon{font-size:40px;margin-bottom:12px;}

@media(max-width:600px){header{padding:0 16px;}.tab-bar{padding:0 16px;}main{padding:20px 16px;}.cards-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="pw-overlay" style="position:fixed;inset:0;background:#111928;display:flex;align-items:center;justify-content:center;z-index:9999;">
  <div style="background:#1f2937;border-radius:16px;padding:40px 36px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);">
    <div style="width:52px;height:52px;background:linear-gradient(135deg,#1a56db,#7e3af2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 20px;">🔒</div>
    <h2 style="font-family:'Syne',sans-serif;color:#fff;font-size:20px;margin-bottom:6px;">Acesso Restrito</h2>
    <p style="color:#6b7280;font-size:13px;margin-bottom:24px;">Digite a senha para continuar</p>
    <input id="pw-input" type="password" placeholder="Senha" style="width:100%;padding:12px 16px;border-radius:8px;border:1px solid #374151;background:#111928;color:#fff;font-size:15px;outline:none;margin-bottom:12px;" onkeydown="if(event.key==='Enter')checkPw()">
    <button onclick="checkPw()" style="width:100%;padding:12px;background:#1a56db;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;">Entrar</button>
    <p id="pw-error" style="color:#e02424;font-size:13px;margin-top:10px;display:none;">Senha incorreta. Tente novamente.</p>
  </div>
</div>
<script>
  (function(){if(sessionStorage.getItem('auth')==='ok'){document.getElementById('pw-overlay').style.display='none';}})();
  function checkPw(){
    var v=document.getElementById('pw-input').value;
    if(v==='teste'){sessionStorage.setItem('auth','ok');document.getElementById('pw-overlay').style.display='none';}
    else{document.getElementById('pw-error').style.display='block';document.getElementById('pw-input').value='';}
  }
</script>
<header>
  <div class="header-left">
    <div class="logo">⚖️</div>
    <div><h1>Controle de Liminaristas</h1><p>Sub judice — Exames de ingresso</p></div>
  </div>
  <div class="header-date" id="hdate"></div>
</header>
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('s1',this)">Liminaristas</button>
  <button class="tab-btn" onclick="switchTab('s2',this)">Req. de Adiamento — Gravidez</button>
</div>
<div id="loading" style="display:flex;align-items:center;justify-content:center;padding:80px;color:#6b7280;font-size:14px;gap:10px;">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
  Carregando dados…
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<main id="main"></main>
<script>
let DATA={s1:[],s2:[]};
fetch('data.json?v='+Date.now())
  .then(r=>r.json())
  .then(d=>{DATA=d;document.getElementById('loading').style.display='none';render();})
  .catch(()=>{document.getElementById('loading').innerHTML='⚠️ Erro ao carregar dados.';});

let tab='s1';
let _ativos=[];

document.getElementById('hdate').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});

function switchTab(t,btn){tab=t;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}

function ini(nome){const p=nome.trim().split(' ').filter(Boolean);return p.length>=2?p[0][0]+p[1][0]:(p[0]||'?').slice(0,2);}

function pill(val,type){
  if(!val||val==='—') return '<span class="pill pill-grey">—</span>';
  if(type==='sn'){const v=val.toLowerCase().trim();if(v==='sim')return '<span class="pill pill-green">✓ Sim</span>';if(v==='não'||v==='nao')return '<span class="pill pill-red">✗ Não</span>';return `<span class="pill pill-amber">${val}</span>`;}
  if(type==='ex') return `<span class="pill pill-blue">${val}</span>`;
  if(type==='am') return `<span class="pill pill-amber">${val}</span>`;
  return `<span class="pill pill-grey">${val}</span>`;
}

const ETAPA_LABELS = {'VDBP':'VDBP','CI':'CI','INSPSAU':'INSPSAU','EAP':'EAP','TACF':'TACF','PPO':'PPO','PPRM':'PPRM','PHC':'PHC','Habilitacao a Matricula':'Hab. Mat.'};

function etapaChip(key,val){
  const label=ETAPA_LABELS[key]||key;
  if(!val) return `<div class="etapa-chip etapa-vazio"><span class="etapa-chip-label">${label}</span><span class="etapa-chip-val">—</span></div>`;
  const v=val.toLowerCase();
  if(v.includes('aguard')) return `<div class="etapa-chip etapa-aguard"><span class="etapa-chip-label">${label}</span><span class="etapa-chip-val">⏳ Aguardando</span></div>`;
  if(v.includes('nao convocar')||v.includes('não convocar')) return `<div class="etapa-chip etapa-nconv"><span class="etapa-chip-label">${label}</span><span class="etapa-chip-val">— N/A</span></div>`;
  return `<div class="etapa-chip etapa-aguard"><span class="etapa-chip-label">${label}</span><span class="etapa-chip-val">${val}</span></div>`;
}

function etapasBlock(etapas){
  if(!etapas||Object.values(etapas).every(v=>!v)) return '';
  const chips=Object.entries(etapas).map(([k,v])=>etapaChip(k,v)).join('');
  return `<div class="etapas-section"><div class="etapas-title">📋 Controle de Etapas</div><div class="etapas-grid">${chips}</div></div>`;
}

function cardS1(r){
  const exDisp=(r.exame_part||'').trim()||r.exame_orig;
  const origRow=(r.exame_part||'').trim()&&r.exame_part.trim()!==r.exame_orig
    ?`<div class="card-row"><div class="card-row-icon">📋</div><span class="card-row-label">Exame original</span><span class="card-row-val">${pill(r.exame_orig,'ex')}</span></div>`:'';
  const emailRow=r.email?`<div class="card-row"><div class="card-row-icon">✉️</div><span class="card-row-label">E-mail</span><span class="card-row-val"><a href="mailto:${r.email}">${r.email}</a></span></div>`:'';
  const telRow=r.telefone?`<div class="card-row"><div class="card-row-icon">📞</div><span class="card-row-label">Telefone</span><span class="card-row-val">${r.telefone}</span></div>`:'';
  return `<div class="cand-card">
    <div class="card-top">
      <div class="card-avatar">${ini(r.nome)}</div>
      <div class="card-title"><div class="card-name">${r.nome.trim()}</div><div class="card-insc">#${r.insc!=='nan'?r.insc:'—'}</div></div>
      <span class="card-status ativo">Ativo</span>
    </div>
    <div class="card-body">
      <div class="card-row"><div class="card-row-icon">🎓</div><span class="card-row-label">Especialidade</span><span class="card-row-val hl">${(r.especialidade||'—').trim()}${(r.sigla||'').trim()?' <span style="color:var(--muted);font-weight:400">('+r.sigla.trim()+')</span>':''}</span></div>
      <div class="card-row"><div class="card-row-icon">📅</div><span class="card-row-label">Exame</span><span class="card-row-val">${pill(exDisp,'ex')}</span></div>
      ${origRow}
      <div class="card-row"><div class="card-row-icon">🏷️</div><span class="card-row-label">Nas vagas</span><span class="card-row-val">${pill(r.nas_vagas,'sn')}</span></div>
      <div class="card-row"><div class="card-row-icon">🎟️</div><span class="card-row-label">Dir. Matrícula</span><span class="card-row-val">${pill(r.direito_matricula,'sn')}</span></div>
      ${emailRow}${telRow}
    </div>
    ${etapasBlock(r.etapas)}
    <div class="card-footer"><span class="footer-label">Processo:</span><span class="footer-val">${(r.processo||'').trim()||'—'}</span></div>
  </div>`;
}

function cardS2(r){
  const sitC=r.situacao_final?.toLowerCase().includes('dentro')?'color:var(--green)':(r.situacao_final?.toLowerCase().includes('indeferi')||r.situacao_final?.toLowerCase().includes('exclu')?'color:var(--red)':'');
  const acaoHtml=r.acao?.toLowerCase().includes('convocar')?pill(r.acao.trim(),'am'):`<span style="color:var(--muted);font-size:12px">${r.acao||'Nenhuma'}</span>`;
  const emailRow=r.email?`<div class="card-row"><div class="card-row-icon">✉️</div><span class="card-row-label">E-mail</span><span class="card-row-val"><a href="mailto:${r.email}">${r.email}</a></span></div>`:'';
  return `<div class="cand-card">
    <div class="card-top">
      <div class="card-avatar">${ini(r.nome)}</div>
      <div class="card-title"><div class="card-name">${r.nome.trim()}</div><div class="card-insc">#${r.insc!=='nan'?r.insc:'—'}</div></div>
      <span class="card-status ativo">Ativo</span>
    </div>
    <div class="card-body">
      <div class="card-row"><div class="card-row-icon">🎓</div><span class="card-row-label">Especialidade</span><span class="card-row-val hl">${(r.especialidade||'—').trim()}</span></div>
      <div class="card-row"><div class="card-row-icon">📅</div><span class="card-row-label">Exame</span><span class="card-row-val">${pill(r.exame,'ex')}</span></div>
      <div class="card-row"><div class="card-row-icon">📌</div><span class="card-row-label">Situação</span><span class="card-row-val" style="${sitC}">${r.situacao_final||'—'}</span></div>
      <div class="card-row"><div class="card-row-icon">🔄</div><span class="card-row-label">Dir. Recondução</span><span class="card-row-val">${r.direito_reconducao?.toLowerCase().startsWith('não')?pill('Não','sn'):pill('Sim','sn')}</span></div>
      <div class="card-row"><div class="card-row-icon">⚡</div><span class="card-row-label">Ação</span><span class="card-row-val">${acaoHtml}</span></div>
      ${(r.exame_convocar||'').trim()?`<div class="card-row"><div class="card-row-icon">📆</div><span class="card-row-label">Convocar para</span><span class="card-row-val">${pill(r.exame_convocar.trim(),'ex')}</span></div>`:''}
      ${emailRow}
    </div>
  </div>`;
}

function render(){
  const data=DATA[tab];
  const ativos=data.filter(r=>r.status==='Ativo');
  _ativos=ativos;
  const nv=ativos.filter(r=>(r.nas_vagas||'').toLowerCase()==='sim').length;
  const dm=ativos.filter(r=>(r.direito_matricula||'').toLowerCase()==='sim').length;
  document.getElementById('main').innerHTML=`
    <div class="kpi-strip">
      <div class="kpi-card"><div class="kpi-icon green">✅</div><div><div class="kpi-num green">${ativos.length}</div><div class="kpi-label">Candidatos ativos</div></div></div>
      <div class="kpi-card"><div class="kpi-icon amber">🏷️</div><div><div class="kpi-num amber">${nv}</div><div class="kpi-label">Ativos nas vagas</div></div></div>
      <div class="kpi-card"><div class="kpi-icon purple">🎟️</div><div><div class="kpi-num purple">${dm}</div><div class="kpi-label">Ativos com dir. matrícula</div></div></div>
    </div>
    <div class="section-head">
      <h2><span class="active-dot"></span>&nbsp; Candidatos Ativos <span style="font-size:13px;color:var(--sub);font-family:'Inter',sans-serif;font-weight:400">(${ativos.length})</span></h2>
      <div class="search-wrap"><span style="color:var(--muted)">🔍</span><input type="text" placeholder="Buscar nome, inscrição, especialidade…" oninput="filterCards(this.value)"></div>
    </div>
    <div class="cards-grid" id="grid">${ativos.map(r=>tab==='s1'?cardS1(r):cardS2(r)).join('')||'<div class="empty"><div class="empty-icon">✅</div><p>Nenhum candidato ativo.</p></div>'}</div>`;
}

function filterCards(q){
  const sq=q.toLowerCase();
  const filtered=sq?_ativos.filter(r=>{const h=[r.nome,r.insc,r.especialidade||'',r.sigla||''].join(' ').toLowerCase();return h.includes(sq);}):_ativos;
  const g=document.getElementById('grid');
  g.innerHTML=filtered.length?filtered.map(r=>tab==='s1'?cardS1(r):cardS2(r)).join(''):`<div class="empty"><div class="empty-icon">🔍</div><p>Nenhum resultado para "<strong>${q}</strong>"</p></div>`;
}

render();
</script>
</body>
</html>
